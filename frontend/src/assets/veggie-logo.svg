<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 80" role="img" aria-labelledby="title desc">
  <title id="title">Veggie Logo</title>
  <desc id="desc">Fresh organic leaf icon mark with text for Veggie Affiliate System.</desc>
  <defs>
    <linearGradient id="veggie-grad" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#84cc16" />
    </linearGradient>
    <linearGradient id="leaf-grad" x1="0%" x2="100%" y1="100%" y2="0%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#a3e635" />
    </linearGradient>
  </defs>
  <rect width="380" height="80" fill="none" />
  <g transform="translate(10, 8)">
    <!-- Shield / Produce badge background -->
    <rect x="0" y="0" width="64" height="64" rx="18" fill="url(#veggie-grad)" />
    <!-- Fresh Leaf Icon -->
    <path d="M 32 12 C 18 12 14 26 14 42 C 26 42 42 40 46 24 C 48 16 40 12 32 12 Z" fill="#ffffff" opacity="0.95" />
    <path d="M 32 12 C 32 26 26 36 14 42" stroke="url(#leaf-grad)" stroke-width="3" stroke-linecap="round" fill="none" />
    <circle cx="48" cy="18" r="4" fill="#a3e635" />
  </g>
  <!-- Text -->
  <text x="86" y="46" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-size="42" font-weight="900" letter-spacing="-0.5px" fill="#091e17">VEGGIE</text>
  <text x="88" y="66" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5px" fill="#059669">AFFILIATE NETWORK</text>
</svg>
