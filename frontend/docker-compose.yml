version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: affiliate_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: affiliate_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/database/schema.sql:/docker-entrypoint-initdb.d/1_schema.sql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: affiliate_backend
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/affiliate_db
      JWT_ACCESS_SECRET: dev_access_secret_12345
      JWT_REFRESH_SECRET: dev_refresh_secret_12345
    depends_on:
      - postgres

volumes:
  postgres_data:
